; Freelook mode player settings. Copy this next to SystemShock2Remastered.exe.
; The DLL re-reads this file each time Freelook turns ON.
[flataim]

; Controls
toggle_vk=0x74                 ; F5
freelook_press_type=toggle     ; toggle or hold

; Display
auto_display=1                 ; read the running KEX canvas size

; Reticle feel
sens_x=12.0
sens_y=12.0
yaw_sign=1.0                   ; flip if horizontal Freelook movement feels backwards
pitch_sign=1.0                 ; flip if vertical Freelook movement feels backwards

; Edge-pan view follow
edge_pan_enabled=1
edge_pan_vk=0x75               ; F6
edge_pan_press_type=always     ; always, off, toggle, or hold_lock
edge_pan_margin_x=0.42
edge_pan_margin_y=0.42
edge_pan_max_yaw_accum=0.75
edge_pan_max_pitch_accum=0.55
edge_pan_curve=2.0
edge_pan_yaw_sign=1.0
edge_pan_pitch_sign=1.0

; Weapon view placement
weapon_proxy_pivot_enable=1
weapon_proxy_pivot_all_weapons=1
weapon_proxy_pivot_long_forward=-0.75
weapon_proxy_pivot_long_left=0.0
weapon_proxy_pivot_long_up=0.0

; Melee view placement
melee_forward_offset=0.0
melee_left_offset=0.0
melee_up_offset=0.0
melee_left_per_deg=-0.015
melee_up_per_deg=0.015
melee_forward_per_deg=0.0

; Selection feedback
selection_debug_marker=1        ; native-looking target brackets

; Support diagnostics
log=0
